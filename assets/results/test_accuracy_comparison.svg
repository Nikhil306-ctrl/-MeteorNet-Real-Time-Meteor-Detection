<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">MeteorNet held-out test accuracy comparison</title>
<desc id="desc">ResNet18 99.0000 percent, MobileNetV2 98.5667 percent, and Custom CNN GroupNorm 97.8000 percent on the same 3000-image test set. The horizontal axis starts at 97 percent.</desc>
<rect width="960" height="470" fill="#ffffff"/>
<text x="58" y="58" fill="#142b3b" font-family="Arial,sans-serif" font-size="30" font-weight="700">Held-out test accuracy</text>
<text x="58" y="91" fill="#536575" font-family="Arial,sans-serif" font-size="16">Same 3,000-image test set · 1,500 images per class</text>
<line x1="300" y1="132" x2="820" y2="132" stroke="#cbd5df" stroke-width="1.5"/>
<line x1="300" y1="132" x2="300" y2="382" stroke="#e4eaf0" stroke-width="1.5"/><text x="300" y="411" text-anchor="middle" fill="#536575" font-family="Arial,sans-serif" font-size="14">97%</text><line x1="473.3333333333333" y1="132" x2="473.3333333333333" y2="382" stroke="#e4eaf0" stroke-width="1.5"/><text x="473.3333333333333" y="411" text-anchor="middle" fill="#536575" font-family="Arial,sans-serif" font-size="14">98%</text><line x1="646.6666666666666" y1="132" x2="646.6666666666666" y2="382" stroke="#e4eaf0" stroke-width="1.5"/><text x="646.6666666666666" y="411" text-anchor="middle" fill="#536575" font-family="Arial,sans-serif" font-size="14">99%</text><line x1="820" y1="132" x2="820" y2="382" stroke="#e4eaf0" stroke-width="1.5"/><text x="820" y="411" text-anchor="middle" fill="#536575" font-family="Arial,sans-serif" font-size="14">100%</text>
<text x="58" y="190" fill="#243b4a" font-family="Arial,sans-serif" font-size="18" font-weight="600">ResNet18</text><rect x="300" y="166" width="346.66666666666663" height="42" rx="7" fill="#176B87"/><text x="658.6666666666666" y="184" fill="#142b3b" font-family="Arial,sans-serif" font-size="16" font-weight="700">99.0000%</text><text x="658.6666666666666" y="202" fill="#536575" font-family="Arial,sans-serif" font-size="12">2,970 / 3,000</text><text x="58" y="274" fill="#243b4a" font-family="Arial,sans-serif" font-size="18" font-weight="600">MobileNetV2</text><rect x="300" y="250" width="271.56133333333287" height="42" rx="7" fill="#159A91"/><text x="583.5613333333329" y="268" fill="#142b3b" font-family="Arial,sans-serif" font-size="16" font-weight="700">98.5667%</text><text x="583.5613333333329" y="286" fill="#536575" font-family="Arial,sans-serif" font-size="12">2,957 / 3,000</text><text x="58" y="358" fill="#243b4a" font-family="Arial,sans-serif" font-size="18" font-weight="600">Custom CNN (GroupNorm)</text><rect x="300" y="334" width="138.66666666666617" height="42" rx="7" fill="#E69A45"/><text x="450.6666666666662" y="352" fill="#142b3b" font-family="Arial,sans-serif" font-size="16" font-weight="700">97.8000%</text><text x="450.6666666666662" y="370" fill="#536575" font-family="Arial,sans-serif" font-size="12">2,934 / 3,000</text>
<text x="58" y="451" fill="#647789" font-family="Arial,sans-serif" font-size="13">Zoomed axis begins at 97.0% for readability; exact values are labelled.</text>
